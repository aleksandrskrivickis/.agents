name: Publish
run-name: Version, release and deploy the handbook

# For each qualifying push to main: bump the version in the Claude plugin manifest, commit it,
# build and zip the handbook, publish the matching GitHub release, then deploy the site to Pages.
# The manifest is the single source of truth for the version, and the release tag follows it. The
# site header shows the latest release automatically (via repo_url). docs/, site/ and dist/ are
# build-only and gitignored. Prerequisite: Settings → Pages → Source = "GitHub Actions".
on:
    push:
        branches: [main]
        paths:
            - "skills/**"
            - "assets/**"
            - "README.md"
            - "AGENTS.md"
            - "mkdocs.yml"
            - ".claude-plugin/**"
            - ".github/copilot-instructions.md"
            - ".github/instructions/**"
            - ".github/workflows/publish.yml"
    workflow_dispatch:

permissions:
    contents: write # create the release
    pages: write
    id-token: write

# Serialised: a newer push queues behind the running one, so two runs can't compute the same version.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    publish:
        # Skip the bump step's own commit. A push with the default GITHUB_TOKEN does not start
        # workflow runs anyway, so this is insurance against swapping in a PAT.
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Zensical
              run: pip install zensical

            - name: Bump the version and commit it
              id: version
              run: |
                  set -euo pipefail
                  manifest=.claude-plugin/plugin.json
                  IFS=. read -r major minor patch <<< "$(jq -r .version "$manifest")"
                  version="$major.$minor.$((patch + 1))"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

                  jq --indent 4 ".version = \"$version\"" "$manifest" > "$manifest.tmp"
                  mv "$manifest.tmp" "$manifest"

                  git config user.name "${{ github.actor }}"
                  git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
                  git commit -am "Release v$version [skip ci]"
                  git push

            # Stage content into a child docs/ dir — Zensical (like MkDocs) can't use docs_dir ".".
            # README.md becomes the site index.
            - name: Stage docs
              run: |
                  mkdir -p docs docs/github/instructions docs/contributing
                  cp -R assets docs/assets
                  cp -R skills docs/skills
                  cp README.md docs/index.md
                  cp .github/copilot-instructions.md docs/github/
                  cp .github/instructions/*.md docs/github/instructions/
                  cp AGENTS.md docs/contributing/index.md

            - name: Build the site
              run: zensical build --clean

            - name: Zip the staged docs for the release
              run: |
                  mkdir -p dist
                  zip -qr "dist/agent-skills-handbook-${{ steps.version.outputs.version }}.zip" docs

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v${{ steps.version.outputs.version }}" \
                    "dist/agent-skills-handbook-${{ steps.version.outputs.version }}.zip" \
                    --target "$(git rev-parse HEAD)" \
                    --generate-notes

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
