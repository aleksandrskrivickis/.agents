name: Deploy to GitHub Pages
run-name: Publish skills knowledge to GitHub Pages

# Renders the Markdown skills into a browsable handbook (Zensical) and deploys to GitHub Pages.
# main only. Prerequisite: Settings → Pages → Source = "GitHub Actions".
on:
    push:
        branches: [main]
        paths:
            - "skills/**"
            - "README.md"
            - "AGENTS.md"
            - "mkdocs.yml"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; a newer push queues behind the running one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Zensical
              run: pip install zensical

            # Stage content into a child docs/ dir — Zensical (like MkDocs) can't use docs_dir ".".
            # README.md becomes the site index. The gitignored api-lawstronaut skill is absent from
            # the checkout, and dropped explicitly so it never reaches the site.
            - name: Stage docs
              run: |
                  rm -rf docs site
                  mkdir -p docs
                  cp -R skills docs/skills
                  rm -rf docs/skills/api-lawstronaut
                  cp README.md docs/index.md
                  cp AGENTS.md docs/AGENTS.md

            - name: Build the site
              run: zensical build --clean

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
