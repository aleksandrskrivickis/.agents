name: Deploy to GitHub Pages
run-name: Publish skills knowledge to GitHub Pages

# Renders the Markdown skills into a browsable site (MkDocs Material) and deploys to GitHub Pages.
# main only. Prerequisite: Settings → Pages → Source = "GitHub Actions".
on:
    push:
        branches: [main]
        paths:
            - "skills/**"
            - "README.md"
            - "AGENTS.md"
            - "mkdocs.yml"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; a newer push queues behind the running one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install MkDocs Material
              run: pip install mkdocs-material

            # Build outside the repo root: docs_dir is "." and MkDocs refuses a site_dir inside docs_dir.
            - name: Build the site
              run: mkdocs build --site-dir "$RUNNER_TEMP/site"

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ runner.temp }}/site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
