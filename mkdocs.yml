site_name: The agent skills handbook
site_description: >-
    A handbook of reusable, production-tested agent skills for Databricks, Spark and Python
    testing — portable across GitHub Copilot, Claude Code and other skills-compatible agents.
site_url: https://aleksandrskrivickis.github.io/.agents/
site_author: Aleksandrs Krivickis
repo_url: https://github.com/aleksandrskrivickis/.agents
repo_name: aleksandrskrivickis/.agents
copyright: >-
    Maintained by <a href="https://www.linkedin.com/in/aleksandrskrivickis/">Aleksandrs Krivickis</a> &middot;
    <a href="https://github.com/aleksandrskrivickis/.agents/issues">Report an issue</a>

# Zensical (the maintained successor to Material for MkDocs) reads this mkdocs.yml.
# Content is staged into docs/ by the build step — neither Zensical nor MkDocs allow docs_dir ".".
docs_dir: docs
site_dir: site

theme:
    name: material
    variant: modern
    font:
        text: Inter
        code: JetBrains Mono
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: lucide/sun-moon
              name: Switch to light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: deep purple
          toggle:
              icon: lucide/sun
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: deep purple
          toggle:
              icon: lucide/moon
              name: Switch to system preference
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.instant
        - navigation.instant.progress
        - toc.follow
        - content.code.copy
        - content.code.annotate
        - search.suggest
        - search.highlight

markdown_extensions:
    - tables
    - admonition
    - attr_list
    - md_in_html
    - def_list
    - toc:
          permalink: true
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.superfences
    - pymdownx.details
    - pymdownx.tabbed:
          alternate_style: true

plugins:
    - search
